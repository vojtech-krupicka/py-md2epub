version: 1
disable_existing_loggers: true

formatters:
  json:
    (): pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(process)s %(message)s %(funcName)s %(filename)s %(lineno)s"
    rename_fields: 
      asctime: datetime
      levelname: level
      name: logger
      process: pid
      filename: file
      funcName: func
      lineno: line
  
  text:
    format: "%(asctime)s %(name)s %(levelname)s %(process)s %(message)s %(funcName)s %(filename)s %(lineno)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  default:
    class: logging.StreamHandler
    formatter: text
    stream: ext://sys.stdout

loggers:
  "":
    level: INFO
    handlers: [default]
