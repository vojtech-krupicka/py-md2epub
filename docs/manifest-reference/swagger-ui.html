  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        spec: {"openapi": "3.1.0", "info": {"title": "voker's Markdown 2 ePUB convertor", "description": "Reference for the `md2epub` manifest: the YAML or JSON file that describes a book and how to build it into an EPUB.\n\nThe schemas below document every manifest field, including the page types (`cover`, `title`, `toc`, `chapter`, `custom`, `subbook`) that make up the book. `Book` is the top-level document, so start there.\n\nThis is a description of the manifest file format, not a web API: there are no endpoints, only schemas. It is generated from the models with `md2epub schema`.", "version": "0.0.0", "contact": {"email": "voker@email.cz"}, "license": {"name": "MIT", "url": "https://mit-license.org/"}}, "externalDocs": {"description": "GitHub", "url": "https://github.com/vojtech-krupicka/py-md2epub"}, "components": {"schemas": {"Author": {"description": "An author of the publication. It fills `creator` elements in EPUB OPF `package` metadata.\n\nPublications can have multiple co-authors, the order of authors is presumed to define the order in which the creator's names **should** be presented by the Reading System.\n\nNote: additional contributors whose contributions are secondary to those listed in `creator` elements **should** be named in `contributor` elements.\n\nSee: \u003chttps://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.2>", "properties": {"role": {"default": "aut", "description": "Lower-case 3-character long values specifies contributor's role.\n\nSee: \u003chttps://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.6>", "examples": ["aut", "art", "edt", "ill"], "title": "Contributor's role", "type": "string"}, "name": {"default": "Anonymous Entity", "description": "Contributor's full name", "examples": ["Rev. Dr. Martin Luther King Jr."], "title": "Contributor's name", "type": "string"}, "file_as": {"default": "", "description": "The `file-as` attribute should be used to specify a normalized form of the contents, suitable for machine processing.\n\nIf this is ommited, it will be filled from contributor's name in format:\n\n`Surname, Name`, for example `Martin Luther King` will be transformed to`King, Martin Luther`.", "examples": ["King, Martin Luther Jr."], "title": "Normalized form of the contributor's name", "type": "string"}}, "title": "Author", "type": "object"}, "Book": {"description": "Represents a book in the EPUB format.", "properties": {"name": {"description": "Used to build this content's own path inside the EPUB (`content/\u003cname>.xhtml` for a generated page, or the folder name for a sub-book). Letters, digits, `.`, `_` and `-` only - not a name made only of dots, so it can never point outside the project.", "examples": ["chapter", "part1", "my-page"], "pattern": "^\\.*[A-Za-z0-9_-][A-Za-z0-9._-]*$", "title": "Technical name", "type": "string"}, "toc_title": {"anyOf": [{"type": "string"}, {"type": "null"}], "default": null, "description": "Optional label to show in the table of contents instead of the default one - a chapter's own first heading, a sub-book's `title`, or as a last resort its technical `name`. Only changes the table of contents entry, not the page's own heading or `\u003ctitle>`.", "examples": ["Chapter One", "Part One"], "title": "Table of contents label"}, "stylesheets": {"default": [], "description": "Stylesheets linked from this content. Inherited by nested content unless overridden.", "examples": [["styles/book.css"]], "items": {"format": "path", "type": "string"}, "title": "Stylesheets", "type": "array", "uniqueItems": true}, "stylesheets_overrides": {"default": [], "description": "Stylesheets that replace, rather than add to, whatever this content would otherwise inherit from its parent.", "examples": [["styles/chapter-only.css"]], "items": {"format": "path", "type": "string"}, "title": "Stylesheet overrides", "type": "array", "uniqueItems": true}, "files": {"default": [], "description": "Files and folders to include in the EPUB in addition to whatever the pages al
