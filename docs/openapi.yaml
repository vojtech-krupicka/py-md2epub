          title: Calibre metadata
        book:
          $ref: '#/components/schemas/Book'
          description: The book's page structure. All of the manifest's own metadata
            above is copied onto it automatically, so it rarely needs to be set here
            directly.
          examples:
          - name: content
            pages:
            - text/ch1.md
          title: Book structure
        config:
          $ref: '#/components/schemas/Config'
          description: Configuration for the EPUB output, the (currently unused) parser,
            and the Markdown conversion.
          examples:
          - markdown:
              tab_length: 4
          title: Configuration
