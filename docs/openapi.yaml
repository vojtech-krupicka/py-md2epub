            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.4>'
          examples:
          - true
          - false
          title: Add to the OPF spine
          type: boolean
        opf_spine_aux:
          default: false
          description: Whether this page is marked `linear="no"` in the spine - present
            in the book, but not part of the main linear reading order (e.g. a notes
            or appendix page).
          examples:
          - true
          - false
          title: Auxiliary spine item
          type: boolean
        opf_guide_type:
          anyOf:
          - $ref: '#/components/schemas/OpfGuideType'
          - type: 'null'
          default: title-page
          description: 'The reference `type` this page gets in the OPF guide, used
            by reading systems to jump straight to a cover, table of contents, etc.
            `None` means the page is not listed in the guide at all.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.6>'
          examples:
          - cover
          - toc
          - title-page
          title: OPF guide type
        opf_guide_title:
          default: Title
          description: The human-readable title for this page's entry in the OPF guide.
          examples:
          - Cover
          - Table of Contents
          title: OPF guide title
          type: string
        add_to_toc:
          default: false
          description: Whether this page gets its own entry in the table of contents
            (both the NCX and the TOC page).
          examples:
          - true
          - false
          title: Add to the table of contents
          type: boolean
        custom_template:
          anyOf:
          - format: path
            type: string
          - type: 'null'
          default: null
          description: Path to a Jinja template to render this page with, relative
            to the manifest's folder, instead of the built-in one for its page type.
          examples:
          - templates/my-chapter.xhtml.jinja
          title: Custom template
        images:
          default: []
          description: Images shown on the title page, in order, above the book's
            metadata.
          examples:
          - - images/logo.png
          items:
            format: path
            type: string
          title: Title page images
          type: array
        render_title:
          default: true
          description: Whether the title page shows the book's title, subtitle and
            author.
          examples:
          - true
          - false
          title: Render the title
          type: boolean
        render_metadata:
          default: true
          description: Whether the title page shows the book's publisher, description,
            rights and identifiers.
          examples:
          - true
          - false
          title: Render metadata
          type: boolean
        additional_content:
          anyOf:
          - format: path
            type: string
          - type: 'null'
          default: null
          description: Path to a Markdown file whose rendered content is appended
            to the title page, if given.
          examples:
          - content/title-foreword.md
          title: Additional content
      title: TitlePage
      type: object
    TocPage:
      description: Represents the table of contents page of the book.
      properties:
        name:
          default: toc
          description: Used to build this content's own path inside the EPUB (`content/<name>.xhtml`
            for a generated page, or the folder name for a sub-book). Letters, digits,
            `.`, `_` and `-` only - not a name made only of dots, so it can never
            point outside the project.
          examples:
          - chapter
          - part1
          - my-page
          pattern: ^\.*[A-Za-z0-9_-][A-Za-z0-9._-]*$
          title: Technical name
          type: string
        toc_title:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Optional label to show in the table of contents instead of
            the default one - a chapter's own first heading, a sub-book's `title`,
            or as a last resort its technical `name`. Only changes the table of contents
            entry, not the page's own heading or `<title>`.
          examples:
          - Chapter One
          - Part One
          title: Table of contents label
        stylesheets:
          default: []
          description: Stylesheets linked from this content. Inherited by nested content
            unless overridden.
          examples:
          - - styles/book.css
          items:
            format: path
            type: string
          title: Stylesheets
          type: array
          uniqueItems: true
        stylesheets_overrides:
          default: []
          description: Stylesheets that replace, rather than add to, whatever this
            content would otherwise inherit from its parent.
          examples:
          - - styles/chapter-only.css
          items:
            format: path
            type: string
          title: Stylesheet overrides
          type: array
          uniqueItems: true
        opf_spine_add:
          default: true
          description: 'Whether this page is part of the book''s linear reading order.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.4>'
          examples:
          - true
          - false
          title: Add to the OPF spine
          type: boolean
        opf_spine_aux:
          default: false
          description: Whether this page is marked `linear="no"` in the spine - present
            in the book, but not part of the main linear reading order (e.g. a notes
            or appendix page).
          examples:
          - true
          - false
          title: Auxiliary spine item
          type: boolean
        opf_guide_type:
          anyOf:
          - $ref: '#/components/schemas/OpfGuideType'
          - type: 'null'
          default: toc
          description: 'The reference `type` this page gets in the OPF guide, used
            by reading systems to jump straight to a cover, table of contents, etc.
            `None` means the page is not listed in the guide at all.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.6>'
          examples:
          - cover
          - toc
          - title-page
          title: OPF guide type
        opf_guide_title:
          default: Table of Contents
          description: The human-readable title for this page's entry in the OPF guide.
          examples:
          - Cover
          - Table of Contents
          title: OPF guide title
          type: string
        add_to_toc:
          default: false
          description: Whether this page gets its own entry in the table of contents
            (both the NCX and the TOC page).
          examples:
          - true
          - false
          title: Add to the table of contents
          type: boolean
        custom_template:
          anyOf:
          - format: path
            type: string
          - type: 'null'
          default: null
          description: Path to a Jinja template to render this page with, relative
            to the manifest's folder, instead of the built-in one for its page type.
          examples:
          - templates/my-chapter.xhtml.jinja
          title: Custom template
        title:
          default: Table of Contents
          description: The heading shown at the top of the table of contents page
            itself.
          examples:
          - Table of Contents
          - Obsah
          title: Table of contents heading
          type: string
        render_links:
          default: true
          description: Whether table of contents entries are rendered as links to
            their target page.
          examples:
          - true
          - false
          title: Render links
          type: boolean
        render_depth:
          default: 2
          description: How many nesting levels of the table of contents are rendered
