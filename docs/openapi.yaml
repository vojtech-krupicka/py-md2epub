          default: .epub
          description: The suffix of the built output file. An EPUB is a zip file,
            so `.zip` is accepted too - useful for inspecting the raw contents with
            a regular archive tool.
          enum:
          - .epub
          - .zip
          examples:
          - .epub
          - .zip
          title: Output file suffix
          type: string
        html_suffix:
          default: .xhtml
          description: The suffix used for every generated content file inside the
            EPUB.
          examples:
          - .xhtml
          title: HTML file suffix
          type: string
        folders:
          default: []
          description: Folders to include in the built EPUB in addition to whatever
            the manifest's pages reference.
          examples:
          - - styles
          items:
            format: path
            type: string
          title: Extra folders
          type: array
        files:
          default: []
          description: Files to include in the built EPUB in addition to whatever
            the manifest's pages reference.
          examples:
          - - images/favicon.png
          items:
            format: path
            type: string
          title: Extra files
          type: array
      title: EpubConfig
      type: object
    Identifier:
      description: 'Represents identifier in ePub metadata section.


        Value of the identifier should be unique.

        Scheme is type of identifier (uuid, isbn, ...).


        See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.10>'
      properties:
        scheme:
          default: uuid
          description: The scheme attribute names the system or authority that generated
            or assigned the text contained within the identifier element, for example
            `ISBN` or `DOI` The values of the scheme attribute are case sensitive
            only when the particular scheme requires it.
          examples:
          - uuid
          - isbn
          title: Identifier's opf:scheme attribute.
          type: string
        value:
          description: A string or number used to uniquely identify the resource.
            An OPF Package Document must include at least one instance of this element
            type, however multiple instances are permitted.
          examples:
          - d4549bba-fae8-4e19-bccb-3910452733a1
          - '9780575086265'
          title: Identifier's unique value.
          type: string
      title: Identifier
      type: object
    Manifest:
      properties:
        file:
          description: Filled in automatically from the path the manifest was loaded
            from; not set by the manifest itself.
          examples:
          - book/manifest.yaml
          format: path
          title: Manifest file path
          type: string
        title:
          description: 'An `<dc:title>` element. An OPF Package Document must include
            at least one instance of this element type, however multiple instances
            are permitted.


            See: https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.1'
          examples:
          - Alice in Wonderland
          title: The title of the publication
          type: string
        supertitle:
          default: ''
          description: The supertitle of the publication. This is not really in OPF
            document or in specifications and maybe, this will be removed later.
          examples:
          - First book
          title: The supertitle of the publication
          type: string
        subtitle:
          default: ''
          description: The subtitle of the publication. This is not really in OPF
            document or in specifications and maybe, this will be removed later.
          examples:
          - A tale of wonderland
          title: The subtitle of the publication
          type: string
        author:
          $ref: '#/components/schemas/Author'
          description: 'The book''s main author. A plain string is shorthand for `{name:
            <string>}`.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.2>'
          examples:
          - Jane Doe
          - name: Jane Doe
            role: aut
          title: Main author
        additional_authors:
          default: []
          description: Co-authors listed after the main `author`, in the same shorthand-or-object
            form.
          examples:
          - - Jane Doe
            - John Smith
          items:
            $ref: '#/components/schemas/Author'
          title: Additional authors
          type: array
        language:
          default: en
          description: 'Identifies a language of the intellectual content of the Publication.
            An OPF Package Document must include at least one instance of this element
            type, however multiple instances are permitted.


            See: See: https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.2'
          examples:
          - en
          title: A language of the resource
          type: string
        created:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          default: null
          description: 'Date of creation, in the format defined by **Date and Time
            Formats** at http://www.w3.org/TR/NOTE-datetime and by ISO 8601 on which
            it is based. In particular, dates without times are represented in the
            form YYYY[-MM[-DD]]: a required 4-digit year, an optional 2-digit month,
            and if the month is given, an optional 2-digit day of month.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.7>'
          examples:
          - '2024'
          - 2024-10
          - '2024-10-03'
          title: Date of creation
        book_id:
          $ref: '#/components/schemas/BookId'
          description: 'The book''s unique identifier. Left unset, a stable one is
            derived from the title, author, publication date and language - the same
            manifest always gets the same identifier, so rebuilding it doesn''t look
            like a new book to a reading system.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.10>'
          examples:
          - scheme: isbn
            value: 978-0-575-08626-5
          title: Book identifier
        published:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          default: null
          description: 'Date of publication of the book with same rules and formats
            as `created`.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.7>'
          examples:
          - '2024'
          - 2024-10
          - '2024-10-03'
          title: Date of publication
        modified:
          anyOf:
          - type: string
          - type: integer
          - type: 'null'
          default: null
          description: 'Date of modification of the book with same rules and formats
            as `created`.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.7>'
          examples:
          - '2024'
          - 2024-10
          - '2024-10-03'
          title: Date of modification
        format:
          default: application/epub+zip
          description: 'The file format, physical medium, or dimensions of the resource.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.9>'
          examples:
          - application/epub+zip
          title: Format
          type: string
        identifiers:
          default: []
          description: 'Further identifiers for the resource (an ISBN, a DOI, ...),
            in addition to `book_id`.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.10>'
          examples:
          - - scheme: isbn
              value: 978-0-575-08626-5
          items:
            $ref: '#/components/schemas/Identifier'
          title: Additional identifiers
          type: array
        subjects:
          default: []
          description: 'Keywords, key phrases or classification codes describing the
            topic of the resource.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.3>'
          examples:
          - - Fantasy
            - Adventure
          items:
            type: string
          title: Subjects
          type: array
        description:
          default: ''
          description: 'An abstract, a table of contents, or a free-text account of
            the resource.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.4>'
          examples:
          - A short account of the book.
          title: Description
          type: string
        publisher:
          default: ''
          description: 'The entity responsible for making the resource available.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.5>'
          examples:
          - ACME Publishing
          title: Publisher
          type: string
        contributors:
          default: []
          description: 'People or organizations whose contribution is secondary to
            the `author`(s) - editors, illustrators, translators, and so on.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.6>'
          examples:
          - - name: Ed Itor
              role: edt
          items:
            $ref: '#/components/schemas/Contributor'
          title: Contributors
          type: array
        rights:
          default: []
          description: 'Information about rights held in and over the resource.


            See: <https://idpf.org/epub/20/spec/OPF_2.0.1_draft.htm#Section2.2.15>'
          examples:
          - - Copyright (c) 2026 Jane Doe. All rights reserved.
          items:
            type: string
          title: Rights
          type: array
        calibre:
          $ref: '#/components/schemas/CalibreMetadata'
          description: Metadata read by Calibre for sorting and for defining a book
