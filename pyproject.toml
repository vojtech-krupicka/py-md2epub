[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown2epub"
dynamic = ["version"]
description = "A command-line tool that builds valid EPUB publications from Markdown chapters, driven by a YAML/JSON manifest."
readme = {file = 'README.md', content-type='text/markdown'}
authors = [{ name = "Vojtěch Krupička", email = "voker@email.cz" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["markdown", "epub", "epub-builder"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0,<9.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "lxml>=6.1.3,<7.0.0",
    "markdown>=3.10.3,<4.0.0",
    "nh3>=0.3.7,<0.4.0",
    "pydantic>=2.13.5,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4,<2.0.0",
    "lxml-stubs>=0.5.1,<0.6.0",
    "pip-audit>=2.10.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.16.8,<0.17.0",
]
docs = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.6.0,<10.0.0",
]

[project.urls]
Homepage = "https://github.com/vojtech-krupicka/py-md2epub"
Documentation = "https://vojtech-krupicka.github.io/py-md2epub/"
Repository = "https://github.com/vojtech-krupicka/py-md2epub"
Issues = "https://github.com/vojtech-krupicka/py-md2epub/issues"
Changelog = "https://github.com/vojtech-krupicka/py-md2epub/blob/main/CHANGELOG.md"

[project.scripts]
md2epub = "md2epub.__main__:cli"

[tool.setuptools.packages.find]
include = ["md2epub*"]

[tool.setuptools.package-data]
md2epub = ["conf/*", "static/*", "templates/*"]

[tool.setuptools.dynamic]
version = {attr = "md2epub._version_from_changelog"}

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["md2epub"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
