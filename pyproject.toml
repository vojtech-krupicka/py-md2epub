[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2epub"
dynamic = ["version"]
description = "A simple python program which creates ePub publication from given list of chapters written in Markdown."
readme = {file = 'README.md', content-type='text/markdown'}
authors = [{ name = "Vojtěch Krupička", email = "voker@email.cz" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["markdown", "epub", "epub-builder"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0,<9.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "lxml>=6.1.3,<7.0.0",
    "markdown>=3.10.3,<4.0.0",
    "nh3>=0.3.7,<0.4.0",
    "pydantic>=2.13.5,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "lxml-stubs>=0.5.1,<0.6.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.8,<0.17.0",
]

[project.urls]
Homepage = "https://github.com/vojtech-krupicka/md2epub"
Documentation = "https://github.com/vojtech-krupicka/md2epub/blob/master/README.md"
Repository = "https://github.com/vojtech-krupicka/md2epub"
Issues = "https://github.com/vojtech-krupicka/md2epub/issues"
Changelog = "https://github.com/vojtech-krupicka/md2epub/blob/master/CHANGELOG.md"

[project.scripts]
md2epub = "md2epub.__main__:cli"

[tool.setuptools.packages.find]
include = ["md2epub*"]

[tool.setuptools.package-data]
md2epub = ["templates/*", "conf/*"]

[tool.setuptools.dynamic]
version = {attr = "md2epub._version_from_changelog"}
